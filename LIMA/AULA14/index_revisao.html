<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Revisão HTML - Conceitos Flex e Grid</title>
</head>
<body>
    <section class="titulo-secao">
        <header class="titulo">
            <a href="#logo"><h1><span>RETRO</span>GAME</h1></a>

            <h3><br><br>Com grandes poderes, vem grandes responsabilidades</h3>
        </header> 

        <header>
            <nav>
                <ul class="nav">
                    <a href="#inicio">Inicio</a>
                    <a href="#sobre">Sobre</a>
                </ul>
                
            </nav>
        </header> 
    </section>

    <main>
        <section class="conteudo">
            <article class="conteudo-art">
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Iure, ratione! Rerum beatae mollitia aut veritatis id, tenetur ea recusandae atque quae ipsa ipsum placeat officiis ex eos soluta deleniti ad?
                </p>
            </article>

            <figure class="conteudo-img">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWXSFaNJ_XI7nw1_go6tGSAd2PmBpbSKxkz53-Ftd1QmBQFMLCnHCQIYDq&s=10" alt="Imagem 1 - Ilustrativa">
                <figcaption>
                    Legenda de Imagem Gerada por IA
                </figcaption>
            </figure>
        </section>

        <section class="galeria">
            <ul>
                <figure>
                    <li>Imagem 2 - Ilustrativa</li>
                    <img src="https://img.ibxk.com.br/2022/08/24/24092526579068.jpeg" alt="Imagem Gerada por IA">
                </figure>
                <figure>
                    <li>Imagem 3 - Ilustrativa</li>
                    <img src="https://super.abril.com.br/wp-content/uploads/2020/08/27-08_fallguys_SITE.jpg?crop=1&resize=1212,909" alt="Imagem Gerada por IA">
                </figure>
                <figure>
                    <li>Imagem 4 - Ilustrativa</li>
                    <img src="https://store-images.s-microsoft.com/image/apps.808.14492077886571533.be42f4bd-887b-4430-8ed0-622341b4d2b0.c8274c53-105e-478b-9f4b-41b8088210a3?q=90&w=512&h=768&mode=crop&format=jpg&background=%23FFFFFF" alt="Imagem Gerada por IA">
                </figure>

            </ul>
        </section>

        <section class="imagem">
            <figure class="imagem-img">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4HrZ6N6IZ3D2Ap2mUU7Qh7CkpTmwXPdUNm4lFY-z_cqlG0dG9HZVBOkk&s=10" alt="Imagem Ilustrativa 5">
            </figure>
        </section>

        <section class="cartoes">
            <figure class="cartoes-img">
                <img src="#" alt="Imagem Ilustrativa 6">
                <aside class="cartões-copo">
                    <!-- aside é um complemento -->
                    <h3>Imagem Ilustrativa 6</h3>
                    <p>Uma aventura em 1 dia</p>
                </aside>
            </figure>
        </section>

        <section class="final">
            <figure class="#">imagem-final</figure>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTrv519xq0q_RTwkGdNKKznN07Srvz84EenDCuIrS3Oi4w93Gtt1isFw2Q&s=10" alt="Imagem Ilustrativa Final">
            <figcaption>
                <strong>Imagem em Destaque</strong>
                <small>Foto de: Vanessa Queiroz</small>
            </figcaption>

        </section>
    </main>
    
</body>
</html>
